<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caderno de Campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Lora:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F0E6;--sf:#FFFEFA;--ac:#315B43;--ac2:#E4E8D9;--gr2:#A8B99A;--wa:#BD7959;--er:#A5573A;--sd:#D4B15D;--tx:#29382F;--bd:#DDDCCF;--mu:#6C776D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A211C;--sf:#222B24;--ac:#8FBB9C;--ac2:#2B382E;--gr2:#6F8A74;--wa:#D79A7B;--er:#E0907A;--tx:#E9E7DB;--bd:#36423A;--mu:#9AA79C}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3,.serif,.temp{font-family:Lora,Georgia,serif;font-weight:500;margin:0}
.ic{flex:none;vertical-align:-3px}.mu{color:var(--mu);font-size:14px}
.k{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);font-weight:600;margin-bottom:6px}
.top{max-width:1120px;margin:auto;padding:22px 24px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.top h1{font-size:24px;color:var(--ac);letter-spacing:-.01em}.top p{margin:0;color:var(--mu);font-size:13px}
nav{display:flex;gap:22px;overflow-x:auto;padding:0 24px;max-width:1120px;margin:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--bd)}
nav button{flex:none;border:0;border-bottom:2px solid transparent;background:none;color:var(--mu);padding:10px 0;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
nav button:hover{color:var(--tx)}nav button.on{color:var(--ac);border-bottom-color:var(--ac)}
main{max-width:1120px;margin:auto;padding:0 24px 96px}
.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:48px;padding:28px 0 26px;border-bottom:1px solid var(--bd)}
.nowrow{display:flex;align-items:center;gap:22px;margin:2px 0 10px}.temp{font-size:84px;line-height:1;color:var(--ac);letter-spacing:-.03em}
.cond{display:flex;flex-direction:column;gap:2px;font-size:15px;color:var(--tx)}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--mu);font-size:14px;margin-bottom:8px}.facts span{display:inline-flex;gap:6px;align-items:center}
.moon{display:flex;align-items:center;gap:14px}.moon .serif{font-size:20px}
.cityrow{display:flex;gap:6px;margin-top:14px;max-width:340px}.cityrow input{margin:0}.cityrow .btn{margin:0}
.split{display:grid;grid-template-columns:1.6fr 1fr;gap:48px;padding:24px 0;border-bottom:1px solid var(--bd)}
.week{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--bd)}
.wd{padding:12px 10px 12px;border-left:1px solid var(--bd);display:flex;flex-direction:column;gap:4px;align-items:flex-start}.wd:first-child{border-left:0;padding-left:0}
.wd.today{box-shadow:inset 0 2px 0 var(--ac)}.wd .k{margin:0}.mm b{font-weight:600}.mm span{color:var(--mu)}
.rain{width:100%;height:4px;background:var(--ac2);border-radius:1px}.rain i{display:block;height:4px;background:var(--ac);border-radius:1px}
.al{display:flex;gap:10px;padding:8px 0 8px 12px;border-left:3px solid var(--wa);margin:0 0 8px;font-size:14px}.al.e{border-left-color:var(--er)}.al .ic{color:var(--er);margin-top:2px}
.nino{margin-top:22px;padding-top:16px;border-top:1px solid var(--bd);font-size:14px}.nino p{margin:6px 0}
.plant{padding:28px 0}.plhead h2{font-size:26px;color:var(--ac)}.plhead p{margin:4px 0 18px;max-width:640px}
.pcol{padding:14px 0 6px;border-top:1px solid var(--bd)}
.pcol ul{list-style:none;margin:0;padding:0;column-count:4;column-gap:36px}.pcol li{break-inside:avoid;display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dotted var(--bd);font-size:14px}.pcol li span{color:var(--mu);font-size:12.5px}
.pcol .k span{font-weight:400}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.dot.g{background:var(--ac)}.dot.y{background:var(--sd)}.dot.r{background:var(--wa)}.dot.n{background:var(--bd)}
.perene{margin-top:18px;padding-top:12px;border-top:1px solid var(--bd);font-size:14px;color:var(--tx)}.perene .k{display:block}
.card{background:transparent;border:0;border-top:1px solid var(--bd);border-radius:0;padding:16px 0;margin:0}
.card h3{font-size:18px;margin:0 0 4px}
.tag{display:inline-block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:2px;background:var(--ac2);color:var(--ac);margin:2px 4px 2px 0;font-weight:600;font-family:"DM Sans",sans-serif}
.tag.w{background:#F3E6BE;color:#6D5712}.tag.e{background:#F1DDD2;color:var(--er)}
@media(prefers-color-scheme:dark){.tag.w{background:#4A4020;color:#E5CD7C}.tag.e{background:#4A2E25;color:#E0907A}}
input,select,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:4px;padding:8px 10px;width:100%;margin:4px 0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gr2);outline-offset:0}
label{font-size:12.5px;color:var(--mu);display:block;margin-top:8px}.row{display:flex;gap:12px}.row>*{flex:1}
.btn{background:var(--ac);color:var(--sf);border:1px solid var(--ac);border-radius:4px;padding:8px 14px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;margin:8px 8px 0 0}.btn.s{background:transparent;color:var(--ac)}.btn:hover{opacity:.88}
details{border-bottom:1px solid var(--bd);padding:10px 0}summary{cursor:pointer;font-weight:500;font-family:Lora,Georgia,serif;font-size:16px}details p,details li{font-size:14.5px;margin:6px 0}
.tg{display:flex;gap:18px;margin:2px 0 12px}.tg button{border:0;border-bottom:2px solid transparent;background:none;color:var(--mu);padding:2px 0;font:inherit;font-size:13px;font-weight:600;cursor:pointer}.tg button.on{color:var(--ac);border-bottom-color:var(--ac)}
.dr{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:14px;padding:5px 0;border-bottom:1px dotted var(--bd)}
.bars{display:flex;align-items:flex-end;gap:2px;height:48px;margin:10px 0 2px}.bars i{flex:1;background:var(--gr2);border-radius:1px 1px 0 0}.bars i.now{background:var(--wa)}
.cg{display:flex;gap:2px;flex:1}.cg i{flex:1;height:16px;border-radius:2px;background:var(--bd)}.cg .c2{background:var(--ac)}.cg .c1{background:var(--sd)}.cg .c0{background:var(--wa);opacity:.55}
.pi{display:flex;gap:16px}.pi img,.ph{flex:none;width:96px;height:96px;object-fit:cover;border-radius:3px;background:var(--ac2)}.ph{display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--mu)}
#app>:not(.hero):not(.split):not(.plant){max-width:760px}
#fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:6px;border:0;background:var(--ac);color:var(--sf);cursor:pointer;z-index:20;display:flex;align-items:center;justify-content:center}
#chat{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 32px));height:min(520px,calc(100vh - 140px));background:var(--sf);border:1px solid var(--bd);border-radius:6px;display:none;flex-direction:column;z-index:20;box-shadow:0 6px 20px #29382f22}
#chat.open{display:flex}#ch{padding:12px 16px;border-bottom:1px solid var(--bd);font:500 17px Lora,Georgia,serif}#ch span{font:400 12.5px "DM Sans",sans-serif;color:var(--mu);display:block}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:88%;padding:8px 12px;border-radius:4px;font-size:14.5px;white-space:pre-wrap}.m.u{align-self:flex-end;background:var(--ac);color:var(--sf)}.m.b{align-self:flex-start;background:var(--ac2)}
#sug{display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px}#sug button{flex:none;font-size:12.5px;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:3px;padding:3px 10px;cursor:pointer}
#cf{display:flex;gap:6px;padding:10px;border-top:1px solid var(--bd)}#cf input{margin:0}
@media(max-width:860px){.hero,.split{grid-template-columns:1fr;gap:26px}.pcol ul{column-count:2}.temp{font-size:68px}.week{grid-template-columns:repeat(7,minmax(74px,1fr));overflow-x:auto}.top{flex-direction:column;gap:2px}}
@media(max-width:520px){.pcol ul{column-count:1}.pi{flex-direction:column}}
</style></head><body>
<header class="top"><div><h1>Caderno de Campo</h1><p id="hp"></p></div><p id="sy"></p></header>
<nav id="nav"></nav><main id="app"></main>
<button id="fab" aria-label="Abrir assistente"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
<div id="chat"><div id="ch">Assistente da horta<span>Responde com o conteúdo deste app, por palavras-chave</span></div><div id="msgs"></div><div id="sug"></div><form id="cf"><input id="ci" placeholder="Pergunte: rega, pragas, alface…" autocomplete="off"><button class="btn" style="margin:0">Enviar</button></form></div>
<script>
const M=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'],MN=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
// [id,nome,categoria,ciclo(dias até 1ª colheita; 0=perene),vaso,torre(1/0),época Sul,geada(s=sensível,r=resiste),dica]
const S=[
['alface','Alface','folhosa',50,'raso',1,'AT','','Pendoa com média acima de 25 °C; no calor use cultivares crespas e sol da manhã. Exige bastante água (Kc 1,05).'],
['rucula','Rúcula','folhosa',40,'raso',1,'mar-ago','','Gosta de 15–25 °C e é sensível à radiação alta. Novembro a janeiro é fora de época; sombra parcial pode ajudar.'],
['coentro','Coentro','cheiro-verde',50,'raso',1,'set-jan','s','Semeadura direta a 0,5–1 cm, desbaste com 3–4 folhas. Sofre no frio. Flores atraem benéficos. Suscetível a nematoides.'],
['salsinha','Salsinha','cheiro-verde',60,'raso',1,'mar-set','','Bianual, tratada como anual. Semeie direto a 0,5–1 cm (não transplanta bem). Suscetível a nematoides.'],
['cebolinha','Cebolinha','cheiro-verde',80,'fundo',1,'AT','','Multiplica por touceira; tolera variação de temperatura. Serve de bordadura em canteiros.'],
['oregano','Orégano','erva',0,'raso',1,'','','Perene; solo calcário, fértil e bem drenado. Renove a planta a cada ano. Ciclo de cerca de 80 dias.'],
['manjericao','Manjericão','erva',60,'raso',1,'','s','Anual, sofre no frio, solo rico em matéria orgânica e bem drenado. Estaca enraíza em água. Renove todo ano.'],
['alecrim','Alecrim','erva',0,'raso',0,'','s','Perene arbustivo, solo calcário e bem drenado. Rende menos no calor e sofre no frio. Estacas lenhosas enraízam devagar.'],
['louro','Louro','erva',0,'fundo',0,'','s','Crescimento lento (12–18 meses até colher), pelo menos 4 h de sol. No Brasil propaga-se por estaca. Não confundir com louro-de-jardim (tóxico).'],
['pimentao','Pimentão','tempero',100,'fundo',0,'set-fev','s','Calor de 21–30 °C, intolerante a geada. Ciclo longo (cerca de 6 meses). Regue na base e use tutor.'],
['cheiro','Pimenta de cheiro','pimenta',90,'fundo',0,'set-fev','s','Semiperene. Germina em 5–15 dias. Após cerca de 5 colheitas, pode e adube com matéria orgânica.'],
['malagueta','Pimenta-malagueta','pimenta',90,'fundo',0,'set-fev','s','Segue o perfil das Capsicum: calor e sem geada. Solanácea: evite repetir no mesmo substrato.'],
['dedo','Pimenta dedo-de-moça','pimenta',90,'fundo',0,'set-fev','s','Segue o perfil das Capsicum: calor e sem geada. Espécie não confirmada.'],
['hortela','Hortelã','erva/chá',0,'raso',1,'','','Perene, gosta de solo úmido e rico em matéria orgânica. Espalha-se: use vaso próprio. Estaca ou divisão de touceira.'],
['tomilho','Tomilho','erva',0,'raso',1,'','','Perene; rende menos no calor e apodrece com excesso de água. Germina em 7–21 dias.'],
['salvia','Sálvia','erva',0,'fundo',0,'','','Perene, pouco exigente em fertilidade; rende menos no calor.'],
['manjerona','Manjerona','erva',0,'raso',1,'','s','Sofre no frio e com excesso de umidade. Renove todo ano.'],
['cebola','Cebola','bulbo',120,'fundo',0,'jul-ago','','Depende do fotoperíodo: dias curtos bulbificam com 12 h de luz ou mais, intermediárias com 13 h. Use só cultivar testada para o local.'],
['alho','Alho','bulbo',150,'fundo',0,'mai-jun','','Do grupo frio; precisa de vernalização nas áreas tropicais. Bulbilho com a ponta para cima.'],
['alhoporo','Alho-poró','bulbo',100,'fundo',0,'','','Sol pleno (6 h ou mais), solo leve, fundo e bem drenado, pH 6–6,8, 13–24 °C. Muda com cerca de 15 cm vai para o canteiro, espaçamento de 15 × 30 cm. Ciclo de 100–150 dias. Fonte antiga e popular; sem calendário da Embrapa.'],
['gengibre','Gengibre','rizoma/chá',240,'fundo',0,'ago-dez','s','Tropical, para de crescer abaixo de 13 °C e não tolera geada. Solo arenoso, drenado e rico em matéria orgânica. Cuidado com cobre.'],
['curcuma','Cúrcuma','rizoma',240,'fundo',0,'','s','Plantio na época de chuva a partir de rizomas; solo bem drenado.'],
['tomate','Tomate-cereja','fruto',100,'fundo',0,'set-fev','s','pH 6,0–6,5. Máxima acima de 35 °C na floração e mínima abaixo de 3 °C prejudicam. Podridão apical = falta de cálcio. Use tutor.'],
['couve','Couve','folhosa',80,'raso',0,'fev-jul','','Do grupo frio; cova única; colheita contínua de folhas.'],
['cenoura','Cenoura','raiz',85,'fundo',0,'fev-ago,nov-jan','','Semeadura direta a 1–1,5 cm; não transplanta. Cenoura de verão: novembro a janeiro.'],
['beterraba','Beterraba','raiz',60,'fundo',0,'AT','','Do grupo frio e resiste à geada.'],
['rabanete','Rabanete','raiz',25,'fundo',0,'mar-ago','','Semeie direto e desbaste com 5 cm; repita a cada 15–20 dias. Novembro a janeiro é fora de época.'],
['pepino','Pepino','fruto',45,'fundo',0,'set-fev','s','Quente; vaso alto com tutor; não tolera geada.'],
['abobrinha','Abobrinha','fruto',45,'fundo',0,'set-mai','s','Direta, 3–5 sementes a 2–3 cm; não transplanta; cova única e larga.'],
['morango','Morango','fruto',70,'raso',1,'mar-abr','s','Do grupo frio; raiz curta (serve para varanda e torre); mínimo de 5 h de sol. Não tolera geada.'],
['agriao','Agrião','folhosa',60,'raso',0,'fev-out','','Sem fonte técnica sobre vaso e clima; fonte popular diz muito sol e muita água.'],
['ora','Ora-pro-nóbis','folhosa',0,'fundo',0,'','','Trepadeira com espinhos; estaca da parte basal ou mediana enraíza melhor; 30–50% de sombra deu melhor resultado.'],
['capim','Capim-limão','chá',0,'fundo',0,'','','Sol pleno ou meia-sombra, rega regular, vaso grande. Propaga por estacas ou divisão de touceira.'],
['camomila','Camomila','chá',0,'raso',1,'','','Cultura de inverno no Sul. Plante no outono ou primavera; evite excesso de nitrogênio. Ciclo divergente (8–12 semanas a 6 meses).'],
['funcho','Erva-doce (funcho)','chá',0,'fundo',0,'','','Foeniculum vulgare, a mais cultivada no Brasil (Paraná é grande produtor). Perene ou bienal, em touceira.'],
['anis','Anis (Pimpinella)','chá',0,'fundo',0,'','s','Cultivo raro no Brasil. Fonte popular: 15–25 °C, não tolera geada intensa, vaso de 30 cm.'],
['chaverde','Chá-verde','chá',0,'fundo',0,'','s','Camellia sinensis: 20–30 °C, chuva de 1.400–2.000 mm, pH 4,5–5,5. Mata a -1 °C em planta jovem. Sem fonte de cultivo no Paraná.'],
['pau','Pau-tenente','chá',0,'fundo',0,'','s','Quassia amara: arbusto amazônico de até 500 m de altitude. Por causa da geada, só em vaso protegido. Compre muda legalizada.']
];
const K=[
{k:['rega','regar','agua','irrigar','molhar','irrigacao'],a:'Rega: calcule ETc = ETo × Kc (1 mm = 1 litro por m² da superfície do vaso) e confirme com o teste do dedo, a cerca de 3 cm. Em recipientes: mudas 2 vezes ao dia, jovens 1 vez, adultas 4–5 vezes por semana, todo dia no calor. Regue no início da manhã e na base das plantas, e nunca deixe água parada no pratinho.'},
{k:['adubo','adubar','adubacao','npk','esterco','humus','fertilizante'],a:'Adubação: em canteiro, folhosas aceitam 2–4 kg/m² de esterco bovino curtido ou composto (ou 0,5–1 kg/m² de esterco de galinha ou húmus). Em vaso não há dose geral confiável: use composto ou húmus no substrato e reponha cobertura de tempos em tempos. O esterco precisa estar curtido (cerca de 90 dias).'},
{k:['substrato','terra','solo','preparo','mistura'],a:'Substrato (receita da Embrapa para recipientes): para 50 litros de terra de barranco peneirada, 100 g de calcário, 34 litros de esterco de gado curtido (ou 17 de galinha) e 200 g de NPK 4-14-8. Em solo urbano desconhecido, prefira substrato comprado ou canteiro elevado por risco de contaminação.'},
{k:['ph','calagem','calcario','acidez','acido'],a:'pH: tomate 6,0–6,5, brócolis 5,8–6,5, batata-doce 5,5–6,5, alho-poró 6–6,8, chá-verde 4,5–5,5. A calagem eleva o pH e fornece cálcio e magnésio (relação cerca de 2,5:1), mas o calcário não age de imediato.'},
{k:['luz','sol','sombra','claridade','etiolada','queimada','murcha'],a:'Luz: o mínimo é cerca de 5 horas de sol direto. Pouca luz deixa a planta comprida, frágil e pálida; calor e sol forte queimam folhas, murcham e derrubam flores. Sol da manhã é mais fácil de manejar que o da tarde. Alface, rúcula e hortelã toleram luz indireta.'},
{k:['geada','frio','congelar','minima'],a:'Geada: alerte quando a mínima prevista no abrigo for 3 °C ou menos. Sensíveis: pimentão, pimentas, pepino, abobrinha, morango, gengibre, manjericão. Resistem: beterraba e repolho. Em Porto Barreiro (772 m) é improvável de novembro a janeiro.'},
{k:['calor','quente','pendoar','pendoamento','florescer'],a:'Calor: média acima de 25 °C faz a alface pendoar; máxima acima de 35 °C na floração derruba flores de tomate e pimentão. Use sombra parcial à tarde e regue todo dia em recipientes.'},
{k:['praga','pragas','inseto','pulgao','lagarta','cochonilha','mosca','acaro','lesma','caracol','vaquinha','formiga'],a:'Pragas comuns: lagartas, pulgões, percevejos, vaquinhas, mosca-branca, cochonilhas, tripes, ácaros, lesmas e formigas. Observe as plantas todos os dias, proteja joaninhas e retire à mão o que puder. Lesmas: estopa úmida com um pouco de leite como armadilha.'},
{k:['doenca','doencas','fungo','fungos','oidio','mancha','ferrugem','mofo','virus','bacteria','nematoide'],a:'Doenças: fúngicas (manchas, ferrugens, oídio) pedem adubação equilibrada, restos doentes retirados e folhas secas; virais não têm cura (controle os pulgões e arranque a planta); nematoides formam galhas nas raízes, e cravo-de-defunto ajuda. Coentro, salsa, manjericão, alface e solanáceas são os mais sensíveis a nematoides.'},
{k:['controle','neem','nim','sabao','calda','natural','organico','biologico','defensivo'],a:'Controle alternativo (Embrapa): óleo de neem 0,5–1 mL por litro; calda de sabão neutro (100 g em 0,5 L de água quente, diluir em 9,5 L; espere 2 semanas antes de colher); calda de cebola como repelente; leite cru a 5–20% contra oídio. Carência geral de cerca de 5 dias. Cuidado com abelhas e insetos benéficos. Não recomendo calda de fumo (nicotina é tóxica).'},
{k:['consorcio','companheira','companheiras','vizinha','junto','aliada'],a:'Consórcio: coentro florido atrai polinizadores e inimigos naturais (testado com tomate); cravo-de-defunto em bordadura funciona como repelente; manjericão com alface ou cenoura não mudou a produção. Há poucos estudos, e muitas listas de plantas companheiras são só tradição popular.'},
{k:['rotacao','rodizio','familia','repetir'],a:'Rotação: alterne famílias botânicas. Em vaso, troque o substrato antes de repetir solanáceas (pimentão, tomate, pimentas) ou espécies sensíveis a nematoides (coentro, salsa, manjericão, alface).'},
{k:['polinizador','polinizadores','abelha','abelhas','flor','flores'],a:'Polinizadores: deixe coentro, cebolinha e manjericão florescerem em parte dos vasos; flores de ervas atraem abelhas e inimigos naturais das pragas. Evite qualquer calda em plantas floridas.'},
{k:['muda','mudas','germinar','germinacao','semear','semente','sementes','semeadura','transplante'],a:'Mudas: semeadura direta com até 3 sementes por cova a até 1,5 cm; transplante com 3–4 pares de folhas. Não transplantam: rabanete, cenoura, almeirão, abobrinha. Guarde sementes secas e fechadas por no máximo um ano. Plantio sucessivo: alface e rabanete a cada 15–20 dias, cenoura e abobrinha a cada 20–30.'},
{k:['poda','podar','pinçar','pincamento','tutor','estaca','estaqueamento','desbrota'],a:'Poda: pince as pontas das ervas para ramificar e colha antes da floração. Pimentão e tomate pedem tutor. Pimenta de cheiro: após cerca de 5 colheitas, pode e adube. A desbrota do tomate ainda não foi pesquisada.'},
{k:['colheita','colher','conservar','conservacao','guardar','secar','congelar'],a:'Colheita e conservação: colha de manhã; guarde entre 0 e 10 °C (pepino, berinjela, abóbora e tomate sofrem abaixo de 7,5 °C). Alecrim, tomilho e orégano secam bem à sombra, com ventilação; manjericão, hortelã e cebolinha são melhores congelados.'},
{k:['composto','compostagem','minhocario','minhoca'],a:'Compostagem: composto e húmus de minhoca são os adubos orgânicos mais indicados. O minhocário para apartamento ainda não foi detalhado neste app.'},
{k:['lua','lunar','fase','fases','crescente','minguante'],a:'Lua: a evidência científica é fraca e inconsistente, e as decisões técnicas (janela de plantio, umidade, previsão) vêm antes. Aqui a lua é só uma tradição opcional, nunca decide sozinha.'},
{k:['torre','vertical','pvc','calha'],a:'Torre de PVC: cano de 200–300 mm cortado como calha, cerca de 20 cm de profundidade, furos de drenagem e espaçamento de 70% do convencional. Plante folhosas, ervas e frutos pequenos; raízes não são recomendadas. Fixe bem, pelo peso molhado, e regue mais, pois seca rápido.'},
{k:['vaso','vasos','recipiente','profundidade'],a:'Vasos: 20 cm de profundidade bastam para folhosas e ervas; tomate, pepino, cenoura, beterraba, rabanete, cebola e cebolinha pedem 30 cm ou mais. Sempre com furos de drenagem.'},
{k:['canteiro','area','chao'],a:'Canteiro: aceita todas as espécies, inclusive raízes. Faça análise de solo (pH e contaminação) antes de plantar direto e corrija com calcário conforme o resultado.'},
{k:['nino','nina','enso','temporal','granizo','enxurrada','enchente'],a:'El Niño (NOAA, 12/11/2026): forte a muito forte, com pico entre novembro e janeiro e duração até jan–mar/2027. No Paraná o Simepar prevê chuva acima da média, com os maiores desvios no Centro-Sul, Sul, Oeste e Sudoeste, temperaturas acima da média em novembro e dezembro e chuva concentrada em poucos dias, com risco de temporais e granizo. Na horta: encharcamento, perda de nutrientes e mais doenças fúngicas. Garanta drenagem, tire a água do pratinho e proteja as mudas do granizo. La Niña tende a trazer menos chuva ao Sul (conhecimento geral, sem fonte pesquisada aqui).'},
{k:['cha','chas','infusao'],a:'Chás: hortelã, gengibre, camomila, erva-doce, chá-verde e pau-tenente estão na aba Espécies. Cuidado com nomes iguais para plantas diferentes (cidreira, boldo, erva-doce). Este app não traz dose nem alegação de saúde.'},
{k:['deficiencia','amarela','amarelada','roxa','arroxeada','carencia','nutriente'],a:'Deficiências: olhe a idade da folha. Fósforo: folhas velhas arroxeadas. Potássio: margens amareladas nas folhas velhas. Cálcio (imóvel) aparece nas folhas novas, como a podridão apical do tomate.'},
{k:['clima','paraguai','regiao','parana','cfa','cfb','porto','barreiro'],a:'Clima: o Paraná é Cfa (verão quente, geada rara) no norte, oeste, litoral e parte do centro e sudoeste, e Cfb (verão fresco) no sul e nos planaltos. Porto Barreiro (772 m) deve estar na transição, mais perto de Cfa. Geadas por ano: Londrina 4, Guarapuava 12, Palmas 23.'}
