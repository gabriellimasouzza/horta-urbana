<style>

<script>
const M=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'],MN=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

const S=[
['alface','Alface','folhosa',50,'raso',1,'AT','','No calor ela "sobe" (solta o talo e amarga) com média acima de 25 °C; use alface crespa e sol da manhã. Pede bastante água.'],
['rucula','Rúcula','folhosa',40,'raso',1,'mar-ago','','Gosta de 15 a 25 °C e não aguenta sol muito forte. De novembro a janeiro é fora de época; meia-sombra pode ajudar.'],
['coentro','Coentro','cheiro-verde',50,'raso',1,'set-jan','s','Semeie direto, a 1 cm de fundo, e desbaste quando tiver 3 ou 4 folhas. Sofre no frio. As flores atraem insetos que ajudam. Sensível a nematoides.'],
['salsinha','Salsinha','cheiro-verde',60,'raso',1,'mar-set','','Dura mais de um ano, mas em casa se trata como anual. Semeie direto, a 1 cm; não gosta de transplante. Sensível a nematoides.'],
['cebolinha','Cebolinha','cheiro-verde',80,'fundo',1,'AT','','Cresce em touceira; divida a touceira para ter mais. Aguenta bem calor e frio. Boa para a borda dos canteiros.'],
['oregano','Orégano','erva',0,'raso',1,'','','Vive vários anos. Gosta de terra fértil, com calcário e bem drenada. Renove a planta uma vez por ano. Primeira colheita em cerca de 80 dias.'],
['manjericao','Manjericão','erva',60,'raso',1,'','s','Dura um ano, sofre no frio e pede terra rica em matéria orgânica e bem drenada. A estaca enraíza na água. Renove todo ano.'],
['alecrim','Alecrim','erva',0,'raso',0,'','s','Arbusto de vários anos. Terra com calcário e bem drenada. Rende menos no calor e sofre no frio. A estaca demora a enraizar.'],
['louro','Louro','erva',0,'fundo',0,'','s','Cresce devagar: leva de 12 a 18 meses para colher. Pede pelo menos 4 horas de sol. No Brasil se multiplica por estaca. Não confunda com o louro-de-jardim, que é tóxico.'],
['pimentao','Pimentão','tempero',100,'fundo',0,'set-fev','s','Gosta de calor (21 a 30 °C) e não aguenta geada. Demora cerca de 6 meses. Regue na base, sem molhar as folhas, e use uma estaca para firmar.'],
['cheiro','Pimenta de cheiro','pimenta',90,'fundo',0,'set-fev','s','Dura vários anos. Nasce em 5 a 15 dias. Depois de umas 5 colheitas, pode e adube com matéria orgânica.'],
['malagueta','Pimenta-malagueta','pimenta',90,'fundo',0,'set-fev','s','Gosta de calor e não aguenta geada, como as outras pimentas. Não repita pimenta ou tomate na mesma terra.'],
['dedo','Pimenta dedo-de-moça','pimenta',90,'fundo',0,'set-fev','s','Gosta de calor e não aguenta geada, como as outras pimentas. A espécie exata não foi confirmada.'],
['hortela','Hortelã','erva/chá',0,'raso',1,'','','Vive vários anos e gosta de terra úmida e rica. Espalha-se muito: plante em vaso só dela. Multiplica por estaca ou dividindo a touceira.'],
['tomilho','Tomilho','erva',0,'raso',1,'','','Vive vários anos. Rende menos no calor e apodrece se tiver água demais. Nasce em 7 a 21 dias.'],
['salvia','Sálvia','erva',0,'fundo',0,'','','Vive vários anos, não exige muita adubação e rende menos no calor.'],
['manjerona','Manjerona','erva',0,'raso',1,'','s','Sofre no frio e com excesso de umidade. Renove a planta todo ano.'],
['cebola','Cebola','bulbo',120,'fundo',0,'jul-ago','','Depende do tamanho do dia: cultivares de dia curto formam bulbo com 12 horas de luz ou mais; as intermediárias, com 13 horas. Use só cultivar indicada para a sua região.'],
['alho','Alho','bulbo',150,'fundo',0,'mai-jun','','Planta de clima frio; em regiões quentes o bulbilho precisa ficar um tempo na geladeira antes de plantar. Plante com a ponta para cima.'],
['alhoporo','Alho-poró','bulbo',100,'fundo',0,'','','Quer sol pleno (6 horas ou mais), terra solta, funda e bem drenada, com acidez entre 6 e 6,8 e temperatura de 13 a 24 °C. Passe a muda de uns 15 cm para o canteiro, com 15 × 30 cm de espaço. Leva de 100 a 150 dias. Informação de fonte antiga e popular; não há calendário da Embrapa.'],
['gengibre','Gengibre','rizoma/chá',240,'fundo',0,'ago-dez','s','Gosta de calor e umidade; abaixo de 13 °C para de crescer e não aguenta geada. Terra arenosa, fértil e que escoa bem. Cuidado: calda com cobre faz mal a ele.'],
['curcuma','Cúrcuma','rizoma',240,'fundo',0,'','s','Plante na época das chuvas, a partir de pedaços do rizoma, em terra que escoa bem.'],
['tomate','Tomate-cereja','fruto',100,'fundo',0,'set-fev','s','Gosta de terra com acidez de 6,0 a 6,5. Máxima acima de 35 °C na floração e mínima abaixo de 3 °C prejudicam. O fundo preto e mole é falta de cálcio. Use estaca.'],
['couve','Couve','folhosa',80,'raso',0,'fev-jul','','Planta de clima frio; uma por cova; dá folhas por muito tempo.'],
['cenoura','Cenoura','raiz',85,'fundo',0,'fev-ago,nov-jan','','Semeie direto, a 1 cm de fundo; não aguenta transplante. A cenoura de verão se planta de novembro a janeiro.'],
['beterraba','Beterraba','raiz',60,'fundo',0,'AT','','Planta de clima frio e aguenta geada.'],
['rabanete','Rabanete','raiz',25,'fundo',0,'mar-ago','','Semeie direto e desbaste quando tiver 5 cm; repita a cada 15 a 20 dias. De novembro a janeiro é fora de época.'],
['pepino','Pepino','fruto',45,'fundo',0,'set-fev','s','Gosta de calor; precisa de vaso fundo e estaca; não aguenta geada.'],
['abobrinha','Abobrinha','fruto',45,'fundo',0,'set-mai','s','Semeie direto, 3 a 5 sementes a 2 ou 3 cm; não aguenta transplante. Uma planta por cova, bem larga.'],
['morango','Morango','fruto',70,'raso',1,'mar-abr','s','Planta de clima frio, de raiz curta (serve para varanda e torre) e pede pelo menos 5 horas de sol. Não aguenta geada.'],
['agriao','Agrião','folhosa',60,'raso',0,'fev-out','','Não achei fonte técnica sobre vaso e clima; uma fonte popular diz que gosta de muito sol e muita água.'],
['ora','Ora-pro-nóbis','folhosa',0,'fundo',0,'','','Trepadeira com espinhos. A estaca do meio ou da base do ramo enraíza melhor. Com 30 a 50% de sombra deu melhor resultado.'],
['capim','Capim-limão','chá',0,'fundo',0,'','','Sol pleno ou meia-sombra, rega regular e vaso grande. Multiplica por estaca ou dividindo a touceira.'],
['camomila','Camomila','chá',0,'raso',1,'','','Cultura de inverno no Sul. Plante no outono ou na primavera e não exagere no nitrogênio. O tempo até florir varia de 8 semanas a 6 meses.'],
['funcho','Erva-doce (funcho)','chá',0,'fundo',0,'','','É o funcho (Foeniculum vulgare), o mais cultivado no Brasil; o Paraná é grande produtor. Dura vários anos e cresce em touceira.'],
['anis','Anis (Pimpinella)','chá',0,'fundo',0,'','s','Cultivo raro no Brasil. Fonte popular: 15 a 25 °C, não aguenta geada forte, vaso de 30 cm.'],

['pau','Pau-tenente','chá',0,'fundo',0,'','s','Quassia amara: arbusto amazônico de até 500 m de altitude. Por causa da geada, só em vaso protegido. Compre a muda de viveiro legalizado.'],
['espinafre','Espinafre','folhosa',60,'raso',1,'fev-set','','O mais comum no Brasil é o espinafre-da-Nova-Zelândia (Tetragonia); o europeu (Spinacia) é outra planta. Aguenta calor, mas não frio forte. Semeie em bandeja e transplante; corte as folhas aos poucos e colha antes de soltar flor.'],
['chicoria','Chicória','folhosa',60,'raso',1,'fev-jul','','É a chicória crespa (também chamada endívia). Parecida com a alface, gosta de 15 a 25 °C. Em regiões altas de clima ameno dá o ano todo.'],
['escarola','Escarola','folhosa',60,'raso',1,'fev-jul','','É a chicória de folha lisa, da mesma espécie da chicória crespa. Gosta de 15 a 25 °C. Não cozinhe demais, porque perde nutrientes.'],
['almeirao','Almeirão','folhosa',60,'raso',1,'fev-out','','Semeie direto: a raiz não aguenta transplante. Deixe 15 a 20 cm entre as plantas. Pede muita água: regue bem e com frequência. Gosta de 15 a 25 °C.'],
['mostarda','Mostarda','folhosa',45,'raso',1,'jul-dez','','Folha de sabor picante, da família da couve. Gosta de 15 a 25 °C. Cresce rápido (45 a 50 dias) e dura pouco depois de colhida.'],
['melissa','Erva-cidreira (melissa)','chá',0,'raso',1,'','','É a Melissa officinalis, a erva-cidreira verdadeira. Aceita clima subtropical e temperado e foi melhor na primavera e no verão. Em estudo, cresceu bem em vasos de 4 litros (terra, esterco curtido e areia, 3:2:1). Multiplica por divisão do rizoma, estaca ou semente. Não confunda com o capim-limão nem com a Lippia alba, que também chamam de cidreira.'],
['hortelapimenta','Hortelã-pimenta','chá',0,'raso',1,'','','Mentha × piperita. Como as outras hortelãs, multiplica por estaca ou divisão da touceira e dá o ano todo. Espalha-se: plante em vaso só dela.'],
['boldo','Boldo','chá',0,'raso',1,'','','Cuidado: boldo é nome de mais de uma planta. No Sul aparecem o boldo-gambá (Plectranthus neochilus) e o falso boldo (Coleus forskohlii); o boldo-do-Chile é outra espécie. Os dois primeiros vivem vários anos e se multiplicam por estaca o ano todo.'],
['lucia','Lúcia-lima','chá',0,'fundo',0,'','s','Aloysia citriodora, também chamada cidrão ou erva-luísa. É um arbusto que chega a 3 m, nativo da América do Sul. Multiplica por estaca ou semente; a Embrapa indica plantar em novembro e dezembro. A poda mantém o tamanho. Não achei fonte sobre geada, então proteja do frio forte.'],
['poejo','Poejo','chá',0,'raso',1,'','','Mentha pulegium: planta rasteira que vive vários anos. Multiplica por ramos ou rizoma, na primavera e no outono. Boa para vaso largo e baixo.'],
['lavanda','Lavanda (alfazema)','chá',0,'fundo',0,'','','Lavandula: arbusto de vários anos. A Embrapa indica estacas em outubro e novembro, ou sementes em março. Não achei fonte sobre clima; pelo que se sabe em geral, gosta de sol e de terra que escoa bem e sofre com calor úmido.'],
['eucalipto','Eucalipto-limão','chá',0,'fundo',0,'','','Corymbia citriodora é uma árvore grande, de uso florestal, com folhas aromáticas. Não achei fonte de cultivo em vaso ou horta; minha avaliação é que só caberia com poda forte e constante. As mudas pedem terra bem úmida no viveiro.'],
['tomatec','Tomate','fruto',100,'fundo',0,'set-fev','s','Existem grupos como Santa Cruz, salada e italiano. Gosta de clima mais seco e com muita luz; lugares úmidos e quentes favorecem doenças. Pede muito adubo e uma estaca. Primeira colheita em 100 a 120 dias.'],
['berinjela','Berinjela','fruto',100,'fundo',0,'ago-jan','s','Planta de clima quente: o calor ajuda na germinação e na muda. Semeie em bandeja e transplante. Primeira colheita em 100 a 120 dias.'],
['quiabo','Quiabo','fruto',70,'fundo',0,'out-dez','s','Pede calor e não aguenta frio. Deixe as sementes 24 horas de molho antes de semear. Aguenta terra ácida e precisa de pouca água. Colha logo, porque estraga rápido.'],
['vagem','Vagem','fruto',60,'fundo',0,'set-mar','s','Semeie direto. Não aguenta frio nem geada e gosta de 15 a 25 °C ou mais. Calor ou frio demais derrubam as flores. Colha antes de ficar fibrosa.'],
['ervilha','Ervilha','fruto',60,'fundo',0,'abr-mai','','Semeie direto: não aguenta transplante. Gosta de clima ameno a frio (até 25 °C), então é planta de outono e inverno no Sul. Para vagem comestível, colha com 60 a 100 dias.'],
['abobora','Abóbora','fruto',90,'fundo',0,'out-fev','s','Planta grande: a Embrapa indica 2,5 × 2,5 m de espaço, então pede canteiro, não vaso. Gosta de calor, aguenta 15 a 25 °C e não resiste à geada. Precisa de abelhas para formar os frutos.'],
['batatadoce','Batata-doce','raiz',120,'fundo',0,'out-dez','s','Rústica e pouco exigente. Plante pedaços de rama com 3 a 4 nós enterrados e a ponta de fora. Frio reduz a colheita e alonga o ciclo; não aguenta geada. Terra arenosa e solta é melhor. Colha com a terra seca.'],
['mandioca','Mandioca','raiz',240,'fundo',0,'set-dez','s','Planta-se um pedaço de caule (maniva) enterrado uns 10 cm, com as gemas para o mesmo lado, no início das chuvas. Gosta de 16 a 28 °C; frio e geada limitam. As de mesa se colhem de 8 a 14 meses depois, então é planta de canteiro grande. A época de setembro a dezembro vem de um estudo em região vizinha ao Paraná.']
];
const K=[
{k:['rega','regar','agua','irrigar','molhar','irrigacao'],a:'Como regar: ponha o dedo na terra, a uns 3 cm. Se estiver seca, regue. Regue de manhã cedo, molhando a terra e não as folhas, e nunca deixe água parada no pratinho. Em vaso e torre a terra seca mais rápido: mudas pedem rega duas vezes ao dia, plantas jovens uma vez e plantas adultas quatro ou cinco vezes por semana. No calor, todo dia. A aba Locais mostra uma estimativa de litros para o seu vaso.'},
{k:['adubo','adubar','adubacao','npk','esterco','humus','fertilizante'],a:'Adubo: composto e húmus de minhoca são os mais fáceis e seguros. Em canteiro, folhosas aceitam 2 a 4 kg de esterco curtido ou composto por m². Em vaso, misture composto ou húmus na terra e ponha mais por cima de tempos em tempos. O esterco precisa estar curtido (uns 90 dias), senão queima as raízes. Evite adubar antes de chuva forte ou geada: o adubo é lavado ou queima os brotos. Para registrar, use o botão "Adubei hoje" na aba Hoje.'},
{k:['substrato','terra','solo','preparo','mistura'],a:'Terra para vasos (receita da Embrapa): para 50 litros de terra peneirada, misture 100 g de calcário, 34 litros de esterco de gado curtido (ou 17 de galinha) e 200 g de adubo NPK 4-14-8. Se não conhece a terra do lugar, prefira terra comprada ou canteiro elevado: terra de cidade pode estar contaminada.'},
{k:['ph','calagem','calcario','acidez','acido'],a:'Acidez da terra (pH): tomate gosta de 6,0 a 6,5; brócolis de 5,8 a 6,5; alho-poró de 6 a 6,8; chá-verde, ao contrário, de terra ácida (4,5 a 5,5). O calcário corrige a acidez e leva cálcio e magnésio, mas demora para agir.'},
{k:['luz','sol','sombra','claridade','etiolada','queimada','murcha'],a:'Sol: a horta precisa de uns 5 horas de sol direto por dia. Com pouca luz, a planta fica comprida, fraca e pálida. Com calor e sol forte, as folhas queimam, murcham e as flores caem. O sol da manhã é mais suave que o da tarde. Alface, rúcula e hortelã aguentam meia-sombra.'},
{k:['geada','frio','congelar','minima'],a:()=>{const L=LOC();const base='Sofrem com geada: pimentão, pimentas, pepino, abobrinha, morango, gengibre e manjericão. Resistem bem: beterraba e repolho. O app avisa quando a previsão da sua cidade passa a ser de 3 °C ou menos.';if(!CL)return'Geada em '+L.n+': o histórico de 10 anos da cidade ainda não carregou (abra a aba Clima com internet). '+base;const fy=CL.fr.reduce((a,b)=>a+b,0),free=CL.fr.map((x,m)=>x<0.3?MN[m].slice(0,3):'').filter(Boolean);return`Geada em ${L.n}: nos últimos 10 anos, cerca de ${fy.toFixed(1)} dias por ano com mínima de 3 °C ou menos. Meses sem geada: ${free.join(', ')||'nenhum'}. `+base}},
{k:['calor','quente','pendoar','pendoamento','florescer'],a:'Calor: com média acima de 25 °C a alface "sobe" (solta o talo e amarga). Com 35 °C ou mais na floração, tomate e pimentão derrubam as flores. Dê sombra à tarde e regue todo dia nos vasos.'},
{k:['praga','pragas','inseto','pulgao','lagarta','cochonilha','mosca','acaro','lesma','caracol','vaquinha','formiga'],a:'Pragas comuns: lagartas, pulgões, percevejos, vaquinhas, mosca-branca, cochonilhas, tripes, ácaros, lesmas e formigas. Olhe as plantas todo dia, inclusive embaixo das folhas, e tire à mão o que puder. Proteja as joaninhas, que comem pulgão. Para lesmas, deixe uma estopa úmida com um pouco de leite e recolha de manhã.'},
{k:['doenca','doencas','fungo','fungos','oidio','mancha','ferrugem','mofo','virus','bacteria','nematoide'],a:'Doenças: fungos (manchas, ferrugem, pó branco) pedem folhas secas, ar circulando e restos doentes retirados. Vírus não têm cura: arranque a planta e combata os pulgões. Nematoides fazem caroços nas raízes: troque a terra e plante cravo-de-defunto. Coentro, salsa, manjericão, alface, tomate e pimentão são os mais sensíveis a eles. Veja a aba Problemas.'},
{k:['controle','neem','nim','sabao','calda','natural','organico','biologico','defensivo'],a:'Controle natural (Embrapa): óleo de neem, 0,5 a 1 mL por litro de água; calda de sabão neutro (100 g em meio litro de água quente, depois misture em 9,5 litros) e espere 2 semanas antes de colher; calda de cebola para afastar insetos; leite cru, 5 a 20% em água, contra o pó branco. Espere uns 5 dias antes de colher. Cuidado com as abelhas. Não indico calda de fumo: a nicotina é tóxica.'},
{k:['consorcio','companheira','companheiras','vizinha','junto','aliada'],a:'Plantar junto: o coentro florido atrai insetos que ajudam (testado com tomate). Cravo-de-defunto na borda afasta pragas. Manjericão perto de alface ou cenoura não mudou a colheita. Há poucos estudos, e muita lista de "plantas companheiras" é só tradição.'},
{k:['rotacao','rodizio','familia','repetir'],a:'Rodízio: não plante sempre a mesma família no mesmo lugar. Em vaso, troque a terra antes de repetir tomate, pimentão ou pimentas, e também coentro, salsa, manjericão e alface.'},
{k:['polinizador','polinizadores','abelha','abelhas','flor','flores'],a:'Abelhas e flores: deixe coentro, cebolinha e manjericão florescerem em alguns vasos. As flores atraem abelhas e insetos que comem pragas. Não borrife nada em planta florida.'},
{k:['muda','mudas','germinar','germinacao','semear','semente','sementes','semeadura','transplante'],a:'Mudas e sementes: ponha até 3 sementes por cova, a no máximo 1,5 cm de fundo. Passe a muda para o lugar definitivo com 3 ou 4 pares de folhas. Rabanete, cenoura, almeirão e abobrinha não gostam de ser transplantados. Guarde sementes secas e fechadas por até 1 ano. Para ter sempre, semeie alface e rabanete a cada 15 a 20 dias; cenoura e abobrinha a cada 20 a 30. Em Plantios você escolhe como plantou (semente, muda, estaca, bulbilho, rizoma e outras, conforme a planta), e o app usa o prazo certo para cada caso; quando não achei prazo confiável, ele diz isso.'},
{k:['poda','podar','pinçar','pincamento','tutor','estaca','estaqueamento','desbrota'],a:'Poda: belisque as pontas das ervas para ramificarem e colha antes de florirem. Pimentão e tomate precisam de uma estaca para firmar. Pimenta de cheiro: depois de umas 5 colheitas, pode e adube. Como tirar os brotos laterais do tomate ainda não foi pesquisado aqui.'},
{k:['colheita','colher','conservar','conservacao','guardar','secar','congelar'],a:'Colheita e guarda: colha de manhã. Guarde na geladeira (0 a 10 °C); pepino, berinjela, abóbora e tomate estragam abaixo de 7,5 °C. Alecrim, tomilho e orégano secam bem na sombra, com ar. Manjericão, hortelã e cebolinha ficam melhores congelados.'},
{k:['composto','compostagem','minhocario','minhoca'],a:'Composto: composto e húmus de minhoca são os melhores adubos de casa. Minhocário para apartamento ainda não foi detalhado aqui.'},
{k:['lua','lunar','fase','fases','crescente','minguante'],a:'Lua: a ciência mostra pouca prova de que a lua ajude o plantio, e o clima, a época e a previsão importam mais. Aqui a lua é só uma tradição opcional e nunca decide sozinha.'},
{k:['torre','vertical','pvc','calha'],a:'Torre de PVC: use cano de 200 a 300 mm cortado ao meio, com uns 20 cm de fundo e furos para a água sair. Deixe as plantas mais juntas (70% do espaço normal). Serve para folhosas, ervas e frutos pequenos; raízes não são indicadas. Fixe bem, porque a terra molhada pesa, e regue mais, pois seca rápido.'},
{k:['vaso','vasos','recipiente','profundidade'],a:'Vasos: 20 cm de fundo bastam para folhosas e ervas. Tomate, pepino, cenoura, beterraba, rabanete, cebola e cebolinha pedem 30 cm ou mais. Sempre com furos no fundo.'},
{k:['canteiro','area','chao'],a:'Canteiro: aceita todas as plantas, até as de raiz. Se for plantar direto no chão, teste a terra (acidez e contaminação) e corrija com calcário.'},
{k:['nino','nina','enso','temporal','granizo','enxurrada','enchente'],a:()=>ninoText()},
{k:['adubei','registrar','registro','historico'],a:'Para registrar o adubo, abra Hoje e, no dia de hoje, use o botão "Adubei hoje". Depois de adubar, o app espera cerca de 15 dias para sugerir de novo. O histórico aparece na aba Plantios.'},
{k:['cha','chas','infusao'],a:'Chás: hortelã, gengibre, camomila, erva-doce, chá-verde e pau-tenente estão na aba Espécies. Cuidado: o mesmo nome serve para plantas diferentes (cidreira, boldo, erva-doce). O app não traz dose nem promessa de saúde.'},
{k:['deficiencia','amarela','amarelada','roxa','arroxeada','carencia','nutriente'],a:'Falta de nutrientes: olhe qual folha sofre. Falta de fósforo: folhas velhas arroxeadas. Falta de potássio: bordas das folhas velhas amareladas. Falta de cálcio aparece nas folhas novas, como o fundo preto e mole do tomate. Veja a aba Problemas.'},
{k:['clima','paraguai','regiao','parana','cfa','cfb','porto','barreiro'],a:()=>{const L=LOC();if(!CL)return'O histórico de clima de '+L.n+' ainda não carregou. Abra a aba Clima com internet.';const top=(a,k)=>a.map((x,i)=>[x,i]).sort((p,q)=>k*(q[0]-p[0]))[0],h=top(CL.mx,1),c=top(CL.mn,-1),w=top(CL.pr,1);return`Clima de ${L.n}${L.alt?' ('+Math.round(L.alt)+' m)':''} nos últimos 10 anos: o mês mais quente é ${MN[h[1]]} (máxima média ${Math.round(h[0])}°); o mais frio é ${MN[c[1]]} (mínima média ${Math.round(c[0])}°); o mais chuvoso é ${MN[w[1]]} (${Math.round(w[0])} mm). Veja a aba Clima.`}}
];
const n=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inEp=(ep,m)=>{if(!ep)return null;if(ep==='AT')return true;return ep.split(',').some(r=>{const[a,b]=r.split('-').map(x=>M.indexOf(x));return a<=b?m>=a&&m<=b:m>=a||m<=b})};

 if(s[3]===0)return['perene','Perene: fica o ano todo no mesmo vaso ou canteiro.',''];
 {const q=rate(s[0],m);if(q!==null)return q===2?['na época','Boa época para o clima da sua cidade; início da colheita em cerca de '+s[3]+' dias.','']:q===1?['no limite','No limite do clima da sua cidade neste mês.','w']:['fora de época','O clima da sua cidade não ajuda neste mês.','e']}
 if(e===null)return['sem dado','Ainda sem dados de clima desta cidade.','w'];

 const col=(t,k,c)=>!g[k].length?'':`<div class="pcol"><div class="k"><i class="dot ${c}"></i>${t} <span>${g[k].length}</span></div><ul>${g[k].map(([s,r])=>`<li title="${esc(r[1])}"><b style="display:flex;gap:8px;align-items:center">${ico(s[0],22)}${esc(s[1])}</b>${s[3]?`<span>${s[3]} dias</span>`:''}</li>`).join('')}</ul></div>`;
 app.innerHTML=W()+`<section class="plant"><div class="plhead"><h2>O que plantar em ${MN[m]}</h2><p class="mu">As épocas usam o clima dos últimos 10 anos da sua cidade (se ainda não carregou, uso o calendário do Sul da Embrapa só nas cidades do Sul). Passe o mouse sobre uma planta para ver o motivo. O número é a espera até a primeira colheita.</p></div><div class="pcols">${col('Boa época','na época','g')}${col('No limite','no limite','y')}${col('Evite agora','fora de época','r')}${col('Sem dado','sem dado','n')}</div><div class="perene"><span class="k">O ano todo, em vaso ou canteiro</span>${g.perene.map(([s])=>esc(s[1])).join(' · ')}</div></section>`}
function Locais(){if(wx===null)wxLoad();app.innerHTML=`<div class="card"><h3>Novo local</h3><label>Nome</label><input id="ln" placeholder="Ex.: torre da varanda"><div class="row"><div><label>Tipo</label><select id="lt"><option value="canteiro">Canteiro</option><option value="torre">Torre de PVC</option><option value="vaso">Vaso</option></select></div><div><label>Profundidade (cm)</label><input id="lp" type="number" value="20"></div></div><div class="row"><div><label>Horas de sol</label><input id="lh" type="number" value="6"></div><div><label>Sol</label><select id="ls"><option>manhã</option><option>tarde</option><option>o dia todo</option></select></div></div><label>Superfície do vaso ou canteiro (m²; vaso de 30 cm ≈ 0,07)</label><input id="lm" type="number" step="0.01" value="0.07"><button class="btn" id="la">Adicionar</button></div>`+
 st.locais.map((l,i)=>{const av=[];if(l.h<5)av.push('menos de 5 horas de sol: prefira folhosas e ervas de meia-sombra');if(l.s==='tarde')av.push('sol de tarde é intenso: proteja no calor');if(l.t==='torre')av.push('seca rápido: regue 4 a 5 vezes por semana, todo dia no calor; não plante raízes');if(l.p<30)av.push('raso: evite tomate, cenoura, beterraba, cebola');return`<div class="card"><h3>${esc(l.n)} <span class="tag">${l.t}</span></h3><div class="mu">${l.p} cm · ${l.h} h de sol (${l.s})</div>${rega(l)}${adubo(l)}${av.map(a=>`<div class="mu">• ${a}</div>`).join('')}<details><summary style="font-size:14px">Editar</summary><label>Nome</label><input id="ln${i}" value="${esc(l.n)}"><div class="row"><div><label>Profundidade (cm)</label><input id="lp${i}" type="number" value="${l.p}"></div><div><label>Horas de sol</label><input id="lh${i}" type="number" value="${l.h}"></div></div><div class="row"><div><label>Sol</label><select id="ls${i}"><option${l.s==='manhã'?' selected':''}>manhã</option><option${l.s==='tarde'?' selected':''}>tarde</option><option${l.s==='o dia todo'?' selected':''}>o dia todo</option></select></div><div><label>Superfície (m²)</label><input id="lm${i}" type="number" step="0.01" value="${l.m||0.07}"></div></div><button class="btn" data-le="${i}">Salvar</button></details><button class="btn s" data-d="${i}">Remover</button></div>`}).join('');
 document.getElementById('la').onclick=()=>{const g=id=>document.getElementById(id).value,nm=g('ln').trim();if(!nm)return;st.locais.push({n:nm,t:g('lt'),p:+g('lp')||20,h:+g('lh')||0,s:g('ls'),m:+g('lm')||0.07});save();render()};
 app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const i=+b.dataset.d;st.plant=st.plant.filter(p=>p.l!==i).map(p=>({...p,l:p.l>i?p.l-1:p.l}));st.locais.splice(i,1);save();render()});app.querySelectorAll('[data-le]').forEach(b=>b.onclick=()=>{const i=+b.dataset.le,g=k=>document.getElementById(k+i).value,l=st.locais[i];l.n=g('ln').trim()||l.n;l.p=+g('lp')||l.p;l.h=+g('lh');l.s=g('ls');l.m=+g('lm')||0.07;save();render()})}

['lagarta','Lagarta','Pragas','Folhas comidas e fezes escuras; a lagarta-rosca corta a muda rente ao chão.','Cate à mão de manhã ou à noite. Óleo de neem, 0,5 a 1 mL por litro de água.'],
['mosca_branca','Mosca-branca','Pragas','Insetos brancos que voam quando você mexe na planta; folhas amareladas.','Calda de sabão neutro ou neem. Ela também passa vírus.'],
['cochonilha','Cochonilha','Pragas','Casquinhas ou "algodão" branco no caule e nas folhas.','Tire à mão ou com algodão; depois sabão neutro ou neem.'],
['acaro','Ácaro','Pragas','Teias finas e pintinhas amareladas nas folhas, em tempo quente e seco.','Lave as folhas e use sabão neutro ou neem.'],
['tripes','Tripes','Pragas','Folhas prateadas ou com riscos e pontinhos pretos.','Calda de sabão neutro ou neem.'],
['lesma','Lesma e caracol','Pragas','Folhas furadas e rastro de baba, mais quando está úmido.','Deixe uma estopa úmida com um pouco de leite e recolha as lesmas de manhã.'],
['vaquinha','Vaquinha','Pragas','Besourinhos que deixam as folhas cheias de furos.','Cate à mão; calda de cebola ajuda a afastar.'],
['nematoide','Nematoide (galhas)','Pragas','Raízes com caroços e planta murcha sem motivo.','Não tem cura. Troque a terra do vaso, plante cravo-de-defunto e não repita coentro, salsa, manjericão, alface, tomate ou pimentão no mesmo lugar.'],
['oidio','Oídio','Doenças','Pó branco, como farinha, nas folhas.','Tire as folhas atacadas, borrife leite cru a 5–20% em água e dê mais sol e ar.'],
['ferrugem','Ferrugem','Doenças','Pintinhas alaranjadas ou marrons, mais embaixo das folhas.','Tire as folhas doentes, não molhe as folhas ao regar e não exagere no adubo.'],
['manchas','Manchas nas folhas','Doenças','Pintas escuras com borda; em cebola, alho e alho-poró, folhas que parecem queimadas.','Tire as folhas, regue na base e troque o lugar do plantio.'],
['podridao','Podridão e murcha','Doenças','Caule mole, mau cheiro e planta murcha com a terra molhada.','Regue menos, melhore a drenagem, arranque a planta e não reuse a terra.'],
['virus','Vírus (mosaico)','Doenças','Folhas manchadas de verde claro e escuro, enrugadas.','Não tem cura. Arranque a planta e controle pulgão e mosca-branca.'],
['def_n','Falta de nitrogênio','Falta de nutriente','Folhas velhas amarelando por inteiro e planta fraca.','Reponha composto ou húmus. (Dica geral, não pesquisada neste projeto.)'],
['def_p','Falta de fósforo','Falta de nutriente','Folhas velhas arroxeadas, começando pelas nervuras; crescimento lento.','Use adubo orgânico completo e confira se a terra não está ácida demais.'],
['def_k','Falta de potássio','Falta de nutriente','Bordas das folhas velhas amareladas ou queimadas.','Reponha composto ou húmus e regue com regularidade.'],
['def_ca','Falta de cálcio','Falta de nutriente','Folhas novas deformadas; fundo do tomate preto e mole.','Regue com regularidade e corrija a acidez com calcário.']];
let pf='Todos';
function Problemas(){const t=['Todos','Pragas','Doenças','Falta de nutriente'];app.innerHTML=`<div class="tg" style="flex-wrap:wrap">${t.map(x=>`<button class="${x===pf?'on':''}" data-f="${x}">${x}</button>`).join('')}</div>`+PR.filter(p=>pf==='Todos'||p[2]===pf).map(p=>`<div class="card"><div class="pi"><img src="imagens/${p[0]}.jpg" alt="${esc(p[1])}" onerror="this.outerHTML='<div class=&quot;ph&quot;>foto em breve</div>'"><div><h3>${esc(p[1])} <span class="tag">${p[2]}</span></h3><div>${esc(p[3])}</div><div class="mu" style="margin-top:4px">O que fazer: ${esc(p[4])}</div></div></div></div>`).join('')+`<div class="mu">Fontes: Embrapa (Horta em pequenos espaços e circulares de nutrição). Cuidado: mesmo caldas naturais podem prejudicar abelhas.</div>`;app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{pf=b.dataset.f;Problemas()})}
const NEM=['alface','coentro','salsinha','manjericao','pimentao','cheiro','malagueta','dedo','tomate'];
function spx(s,k){const t=k.k;if(t.includes('rega'))return s[4]==='raso'?`Para ${s[1]}: em vaso raso a terra seca rápido; olhe todo dia.`:s[3]?`Para ${s[1]}: vaso fundo segura mais água, mas confirme com o dedo.`:`Para ${s[1]}: planta de vários anos; regue quando a terra a 3 cm estiver seca.`;if(t.includes('praga')||t.includes('doenca'))return NEM.includes(s[0])?`${s[1]} é muito sensível a nematoides (galhas nas raízes): troque a terra antes de repetir.`:'';if(t.includes('colheita'))return['folhosa','cheiro-verde'].includes(s[2])?'Colha as folhas de fora e deixe o centro crescer; colha antes de florescer.':s[2].startsWith('erva')?'Colha de manhã, antes de florir, e pince as pontas para ramificar.':'';if(t.includes('vaso'))return`${s[1]}: vaso ${s[4]==='raso'?'de 20 cm':'de 30 cm ou mais'}; torre de PVC: ${s[5]?'pode':'não indicado'}.`;return''}
// chat
const chat=document.getElementById('chat'),msgs=document.getElementById('msgs'),ci=document.getElementById('ci');
const keys=S.map(s=>({s,ks:[n(s[1].replace(/\(.*\)/,'')).trim(),n(s[0])]})).flatMap(o=>o.ks.map(k=>({s:o.s,k})));
const alias={'poro':'alhoporo','alho poro':'alhoporo','alho-poro':'alhoporo','funcho':'funcho','erva doce':'funcho','cidreira':'capim','capim limao':'capim','pimenta':'cheiro','cha verde':'chaverde','quassia':'pau','ora pro nobis':'ora','tomate':'tomatec','tomate cereja':'tomate','tomate-cereja':'tomate','batata doce':'batatadoce','hortela pimenta':'hortelapimenta','alfazema':'lavanda','cidrao':'lucia','erva luisa':'lucia','eucalipto limao':'eucalipto'};
function add(t,c){const d=document.createElement('div');d.className='m '+c;d.textContent=t;msgs.appendChild(d);msgs.scrollTop=1e9;return d}
function answer(t){const x=n(t),w=x.split(/[^a-z0-9]+/).filter(Boolean);let sp=null,bl=0;
 for(const o of keys){if(x.includes(o.k)&&o.k.length>bl){sp=o.s;bl=o.k.length}}
 for(const a in alias){if(x.includes(a)&&a.length>bl){sp=S.find(s=>s[0]===alias[a]);bl=a.length}}
 let best=null,bs=0;for(const e of K){const sc=e.k.filter(k=>w.includes(k)).length;if(sc>bs){bs=sc;best=e}}
 const out=[];if(sp){const r=status(sp);out.push(`${sp[1]}: ${sp[8]}\nCiclo: ${sp[3]?sp[3]+' dias':'perene'} · vaso ${sp[4]} · torre ${sp[5]?'sim':'não'} · época no Sul: ${sp[6]||'sem dado'}.\nHoje: ${r[1]}`)}
 if(best)out.push(typeof best.a==='function'?best.a():best.a);if(sp&&best){const x=spx(sp,best);if(x)out.push(x)}
 if(!out.length)return'Não encontrei isso no conteúdo do app. Tente palavras como rega, adubo, pH, geada, pragas, doenças, consórcio, mudas, poda, colheita, torre, vaso, ou o nome de uma planta (alface, alho-poró, gengibre…).';
 return out.join('\n\n')}
function ask(t){if(!t.trim())return;add(t,'u');const b=add('…','b');setTimeout(()=>{const a=answer(t);b.textContent='';let i=0;const iv=setInterval(()=>{b.textContent=a.slice(0,i+=4);msgs.scrollTop=1e9;if(i>=a.length)clearInterval(iv)},12)},450+Math.random()*350)}
document.getElementById('fab').onclick=()=>{chat.classList.toggle('open');if(chat.classList.contains('open')&&!msgs.children.length){add('Olá! Pergunto sobre o conteúdo deste app: rega, adubo, pragas, geada, o que plantar… ou o nome de uma planta.','b')}};
document.getElementById('cf').onsubmit=e=>{e.preventDefault();ask(ci.value);ci.value=''};
document.getElementById('sug').innerHTML=['Como regar?','Alho-poró','Pragas','Geada','Torre de PVC'].map(s=>`<button type="button">${s}</button>`).join('');
document.querySelectorAll('#sug button').forEach(b=>b.onclick=()=>ask(b.textContent));
render();syncPull();CLboot();ensoLoad();
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const cfg=window.FIREBASE_CONFIG,FB=window.FB={on:false,t:null,user:null},say=t=>{const e=document.getElementById("sy");if(e)e.textContent=t};
if(cfg){const au=getAuth(initializeApp(cfg)),db=getFirestore();let uid=null;
FB.login=()=>signInWithPopup(au,new GoogleAuthProvider()).catch(()=>say("Nuvem: não consegui entrar"));FB.logout=()=>signOut(au);
FB.push=()=>{clearTimeout(FB.t);FB.t=setTimeout(async()=>{if(!uid)return;say("Nuvem: salvando…");try{await setDoc(doc(db,"horta",uid),{d:JSON.stringify(window.FBdata()),u:window.FBst()});say("Nuvem: salvo")}catch(e){say("Nuvem: erro ao salvar")}},1500)};
onAuthStateChanged(au,async u=>{uid=u?u.uid:null;FB.on=!!u;FB.user=u;window.fbUI();if(!u){say("");return}say("Nuvem: conectando…");try{const r=await getDoc(doc(db,"horta",u.uid));if(r.exists()){const x=r.data();if((x.u||0)>window.FBst())window.FBapply(JSON.parse(x.d));else if((x.u||0)<window.FBst())FB.push()}else FB.push();say("Nuvem: salvo")}catch(e){say("Nuvem: erro ao conectar")}})}
</script>
